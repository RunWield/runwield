name: publish-docs

on:
    workflow_call:
        inputs:
            tag:
                required: true
                type: string
            bootstrap:
                required: false
                default: false
                type: boolean
    workflow_dispatch:
        inputs:
            tag:
                description: Stable release to document; leave empty for GitHub latest
                required: false
                type: string
            bootstrap:
                description: Create docs/stable and backport the site from this revision
                required: false
                default: false
                type: boolean
    push:
        branches:
            - docs/stable
        paths:
            - "docs/**"
            - "docs-site/**"
            - "scripts/public-docs.ts"
            - "scripts/check-public-docs.ts"
            - "scripts/docs-dev.ts"
            - "scripts/verify-docs-source.ts"
            - "docs-site/bun.lock"
            - "docs-site/bunfig.toml"

permissions:
    contents: read

concurrency:
    group: runwield-docs-pages
    cancel-in-progress: false

jobs:
    sync:
        if: github.event_name != 'push' || github.ref != 'refs/heads/docs/stable'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.release.outputs.tag }}
            sha: ${{ steps.source.outputs.sha }}
            tooling_sha: ${{ steps.tooling.outputs.sha }}
        steps:
            - name: Checkout workflow revision
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Record immutable tooling revision
              id: tooling
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Select latest Stable release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  REQUESTED_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft --jq 'select(.isPrerelease == false and .isDraft == false) | .tagName')
                  tag=${REQUESTED_TAG:-$latest}
                  test -n "$tag"
                  test "$tag" = "$latest" || { echo "Refusing to replace current docs with $tag; latest is $latest" >&2; exit 1; }
                  gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft --jq 'select(.isPrerelease == false and .isDraft == false)' >/dev/null
                  git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen dependencies
              run: bun run install:locked

            - name: Verify complete qualified release assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/docs-release-assets"
                  gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/docs-release.json"
                  bun scripts/release-assets.js \
                    "$RUNNER_TEMP/docs-release-assets" "$RUNNER_TEMP/verified-docs-release" \
                    "$RELEASE_TAG" published "$RUNNER_TEMP/docs-release.json"

            - name: Reconcile Stable source and documentation corrections
              run: >-
                  bash scripts/reconcile-docs-branch.sh
                  '${{ steps.release.outputs.tag }}'
                  '${{ inputs.bootstrap || false }}'
                  '${{ github.sha }}'

            - name: Record exact documentation source
              id: source
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    deploy:
        if: ${{ !cancelled() && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
        needs: sync
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout exact documentation source
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.sync.outputs.sha || github.sha }}
                  path: source
                  fetch-depth: 0

            - name: Checkout Bun documentation tooling
              uses: actions/checkout@v5
              with:
                  # Push corrections use the current default-branch toolchain, never old Stable scripts.
                  ref: ${{ needs.sync.outputs.tooling_sha || github.event.repository.default_branch }}
                  path: tooling
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: tooling/.bun-version

            - name: Install frozen tooling dependencies
              working-directory: tooling
              run: bun run install:locked

            - name: Verify documentation source and qualified release
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  documented=$(bun -e 'console.log(JSON.parse(await Bun.file("docs-site/release.json").text()).version)')
                  latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft --jq 'select(.isPrerelease == false and .isDraft == false) | .tagName')
                  test "$documented" = "$latest" || { echo "Documented $documented is stale; latest is $latest" >&2; exit 1; }
                  bun ../tooling/scripts/verify-docs-source.ts "$documented" "$(git rev-parse HEAD)"
                  gh release download "$documented" --dir "$RUNNER_TEMP/docs-release-assets"
                  gh api "repos/$GITHUB_REPOSITORY/releases/tags/$documented" > "$RUNNER_TEMP/docs-release.json"
                  bun ../tooling/scripts/release-assets.js \
                    "$RUNNER_TEMP/docs-release-assets" "$RUNNER_TEMP/verified-docs-release" \
                    "$documented" published "$RUNNER_TEMP/docs-release.json"
                  source_ref=$(git rev-parse HEAD)
                  bun -e '
                    const path = "docs-site/release.json";
                    const release = JSON.parse(await Bun.file(path).text());
                    release.sourceRef = process.argv[1];
                    await Bun.write(path, `${JSON.stringify(release, null, 2)}\n`);
                  ' "$source_ref"

            - name: Build and check documentation
              run: bun tooling/scripts/build-stable-docs.ts source

            - name: Configure Pages
              uses: actions/configure-pages@v5
              with:
                  enablement: true

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: source/dist/docs

            - name: Reject stale build before deployment
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  documented=$(bun -e 'console.log(JSON.parse(await Bun.file("docs-site/release.json").text()).version)')
                  latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft --jq 'select(.isPrerelease == false and .isDraft == false) | .tagName')
                  test "$documented" = "$latest" || { echo "Documented $documented became stale; latest is $latest" >&2; exit 1; }
                  bun ../tooling/scripts/verify-docs-source.ts "$documented" "$(git rev-parse HEAD)"

            - name: Deploy Pages
              id: deployment
              uses: actions/deploy-pages@v4
