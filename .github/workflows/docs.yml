name: publish-docs
run-name: docs ${{ inputs.tag || 'correction' }} ${{ inputs.request || github.sha }}

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Stable release to document; leave empty for GitHub latest
                required: false
                type: string
            request:
                description: Release workflow correlation ID
                required: false
                type: string
    push:
        branches:
            - docs/stable
        paths:
            - "docs/**"
            - "docs-site/**"
            - "scripts/public-docs.ts"
            - "scripts/check-public-docs.ts"
            - "scripts/docs-dev.ts"
            - "scripts/verify-docs-source.ts"

permissions:
    contents: read

concurrency:
    group: runwield-docs-pages
    cancel-in-progress: false

jobs:
    deploy:
        if: github.ref == 'refs/heads/docs/stable'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout exact documentation source
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.sha }}
                  path: source
                  fetch-depth: 0

            - name: Checkout Bun documentation tooling
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  path: tooling
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: tooling/.bun-version

            - name: Install frozen tooling dependencies
              working-directory: tooling
              run: bun run install:locked

            - name: Select latest Stable release
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
                  REQUESTED_TAG: ${{ inputs.tag }}
              run: |
                  set -euo pipefail
                  test "$GITHUB_REF" = refs/heads/docs/stable
                  latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft --jq 'select(.isPrerelease == false and .isDraft == false) | .tagName')
                  tag=${REQUESTED_TAG:-$latest}
                  test -n "$tag"
                  test "$tag" = "$latest" || { echo "Refusing to replace current docs with $tag; latest is $latest" >&2; exit 1; }
                  documented=$(bun -e 'console.log(JSON.parse(await Bun.file("docs-site/release.json").text()).version)')
                  test "$tag" = "$documented"
                  gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft --jq 'select(.isPrerelease == false and .isDraft == false)' >/dev/null
                  git fetch origin "refs/tags/$tag:refs/tags/$tag"

            - name: Verify documentation source and qualified release
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  documented=$(bun -e 'console.log(JSON.parse(await Bun.file("docs-site/release.json").text()).version)')
                  bun ../tooling/scripts/verify-docs-source.ts "$documented" "$(git rev-parse HEAD)"
                  gh release download "$documented" --dir "$RUNNER_TEMP/docs-release-assets"
                  gh api "repos/$GITHUB_REPOSITORY/releases/tags/$documented" > "$RUNNER_TEMP/docs-release.json"
                  bun ../tooling/scripts/release-assets.js \
                    "$RUNNER_TEMP/docs-release-assets" "$RUNNER_TEMP/verified-docs-release" \
                    "$documented" published "$RUNNER_TEMP/docs-release.json"

            - name: Select qualified documentation bytes
              id: asset
              working-directory: source
              env:
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  set -euo pipefail
                  documented=$(bun -e 'console.log(JSON.parse(await Bun.file("docs-site/release.json").text()).version)')
                  archive="$RUNNER_TEMP/verified-docs-release/runwield-docs-$documented.tar.gz"
                  rebuild=true
                  if [ "$EVENT_NAME" = workflow_dispatch ] && [ -f "$archive" ]; then
                    mkdir -p dist/docs
                    tar -xzf "$archive" -C dist/docs
                    recorded=$(bun -e 'console.log(JSON.parse(await Bun.file("dist/docs/release.json").text()).sourceRef)')
                    version=$(bun -e 'console.log(JSON.parse(await Bun.file("dist/docs/release.json").text()).version)')
                    test "$version" = "$documented"
                    if [ "$recorded" = "$(git rev-parse HEAD)" ]; then rebuild=false; fi
                  fi
                  echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"

            - name: Build and check documentation corrections
              if: steps.asset.outputs.rebuild == 'true'
              run: |
                  set -euo pipefail
                  # A correction or legacy release uses the current frozen tooling.
                  # Remove extracted output before rebuilding a changed docs source.
                  if [ -d source/dist/docs ]; then mv source/dist/docs "$RUNNER_TEMP/previous-docs-asset"; fi
                  source_ref=$(git -C source rev-parse HEAD)
                  bun -e '
                    const path = "source/docs-site/release.json";
                    const release = JSON.parse(await Bun.file(path).text());
                    release.sourceRef = process.argv[1];
                    await Bun.write(path, JSON.stringify(release, null, 2) + "\n");
                  ' "$source_ref"
                  bun tooling/scripts/build-stable-docs.ts source
                  cp source/docs-site/release.json source/dist/docs/release.json

            - name: Configure Pages
              uses: actions/configure-pages@v5
              with:
                  enablement: true

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: source/dist/docs

            - name: Reject stale build before deployment
              working-directory: source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  documented=$(bun -e 'console.log(JSON.parse(await Bun.file("docs-site/release.json").text()).version)')
                  latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,isDraft --jq 'select(.isPrerelease == false and .isDraft == false) | .tagName')
                  test "$documented" = "$latest" || { echo "Documented $documented became stale; latest is $latest" >&2; exit 1; }
                  bun ../tooling/scripts/verify-docs-source.ts "$documented" "$(git rev-parse HEAD)"

            - name: Deploy Pages
              id: deployment
              uses: actions/deploy-pages@v4
