name: Windows release repair diagnostic

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Release ref to test
                required: true

permissions:
    contents: read

jobs:
    source:
        strategy:
            fail-fast: false
            matrix:
                runner: [windows-2025, windows-11-arm]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}
                  submodules: recursive
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version
            - run: bun run install:locked
            - run: bun run workspace:build
            - name: Check timeout evidence
              run: bun scripts/run-tests.js scripts/run-with-snip.test.ts --filter 'a timed-out test'
            - name: Repeat consent and Stop checks
              env:
                  WLD_TEST_CONCURRENCY: "2"
                  WLD_TEST_FILE_TIMEOUT_MS: "120000"
              shell: pwsh
              run: |
                  1..5 | ForEach-Object {
                    Write-Host "Native repetition $_"
                    bun scripts/run-tests.js src/ui/tui/chat-session.test.ts src/ui/workspace/background-stop.integration.test.ts
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }
            - name: Retain subprocess failure logs
              if: always()
              shell: pwsh
              run: |
                  $destination = '.ci-cache/failure-logs'
                  New-Item -ItemType Directory -Force $destination | Out-Null
                  Get-ChildItem $env:RUNNER_TEMP -File -Filter 'tests-*.log' | Select-Object -First 30 | ForEach-Object {
                    if ($_.Length -le 5MB) {
                      Copy-Item $_.FullName $destination
                      Get-Content $_.FullName -Tail 100
                    }
                  }
            - uses: actions/upload-artifact@v5
              if: always()
              with:
                  name: windows-repair-${{ matrix.runner }}-${{ github.run_attempt }}
                  path: .ci-cache/
                  include-hidden-files: true
