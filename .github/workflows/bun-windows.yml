name: Bun Windows path diagnostic
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    paths:
        runs-on: windows-2025
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.3"
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Compare native canonical paths
              shell: pwsh
              run: |
                  $probe = @'
                  import * as fs from "node:fs";
                  import * as os from "node:os";
                  import * as path from "node:path";
                  const root = process.argv[2];
                  for (const candidate of [root, root.toLowerCase(), root.replaceAll("\\", "/")]) {
                    console.log(JSON.stringify({runtime: process.versions, input: candidate, sync: fs.realpathSync(candidate), native: fs.realpathSync.native(candidate), async: await fs.promises.realpath(candidate)}));
                  }
                  '@
                  $tempRoot = deno eval --no-config 'import * as fs from "node:fs"; import * as os from "node:os"; import * as path from "node:path"; console.log(await fs.promises.mkdtemp(path.join(os.tmpdir(), "wld-windows-package-")))'
                  $root = Join-Path $tempRoot 'User Profile/workspace-artifact-project'
                  New-Item -ItemType Directory -Force $root | Out-Null
                  $file = Join-Path $env:RUNNER_TEMP 'path-probe.mjs'
                  Set-Content -LiteralPath $file -Value $probe
                  node $file $root
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  bun $file $root
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  deno run --no-config -A $file $root
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Install frozen Bun graphs
              run: bun run install:locked
            - name: Run native Project and Session regressions
              shell: pwsh
              run: |
                  bun scripts/write-version.js
                  bun scripts/run-bun-tests.ts src/shared/owner-coordination/projects.test.js src/shared/owner-coordination/sessions.test.js src/shared/session/file-session-store.test.js src/shared/session/root-session.test.js
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Verify regression rejects previous resolver
              shell: pwsh
              run: |
                  bun -e 'for (const file of ["src/shared/owner-coordination/projects.js", "src/shared/owner-coordination/sessions.js", "src/shared/session/file-session-storage.ts", "src/shared/session/root-session.js", "src/ui/workspace/server/owner-projects.ts"]) { const text = await Bun.file(file).text(); await Bun.write(file, text.replaceAll("realpathSync.native(", "realpathSync(")); }'
                  bun scripts/run-bun-tests.ts src/shared/owner-coordination/projects.test.js src/shared/session/file-session-store.test.js src/shared/session/root-session.test.js
                  if ($LASTEXITCODE -eq 0) { throw 'Regression did not reject previous resolver' }
                  exit 0
