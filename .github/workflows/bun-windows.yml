name: Bun Windows path diagnostic
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    paths:
        runs-on: windows-2025
        timeout-minutes: 5
        steps:
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.3"
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Compare native canonical paths
              shell: pwsh
              run: |
                  $probe = @'
                  import * as fs from "node:fs";
                  import * as os from "node:os";
                  import * as path from "node:path";
                  const root = process.argv[2];
                  for (const candidate of [root, root.toLowerCase(), root.replaceAll("\\", "/")]) {
                    console.log(JSON.stringify({runtime: process.versions, input: candidate, sync: fs.realpathSync(candidate), native: fs.realpathSync.native(candidate), async: await fs.promises.realpath(candidate)}));
                  }
                  '@
                  $root = Join-Path $env:RUNNER_TEMP 'User Profile/path-project'
                  New-Item -ItemType Directory -Force $root | Out-Null
                  $file = Join-Path $env:RUNNER_TEMP 'path-probe.mjs'
                  Set-Content -LiteralPath $file -Value $probe
                  node $file $root
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  bun $file $root
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  deno run --no-config -A $file $root
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
