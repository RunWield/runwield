name: Bun Unix qualification

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: bun-unix-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    source:
        name: Bun ${{ matrix.runner }} source ${{ matrix.shard }}
        if: github.event.repository.private == false
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 50
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-latest, macos-latest]
                shard: [1, 2, 3, 4]
        env:
            WLD_TEST_CONCURRENCY: "4"
            WLD_TEST_FILE_TIMEOUT_MS: "600000"
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version
            - uses: actions/setup-go@v6
              with:
                  go-version: "1.25.x"
                  cache: false
            - name: Prepare external tool boundaries
              run: |
                  mkdir -p "$RUNNER_TEMP/runwield-ci-bin"
                  GOBIN="$RUNNER_TEMP/runwield-ci-bin" go install github.com/edouard-claude/snip/cmd/snip@v0.24.1
                  for binary in mnemoteca cymbal ketch; do
                    cat > "$RUNNER_TEMP/runwield-ci-bin/$binary" <<'EOF'
                  #!/usr/bin/env bash
                  if [[ "$1" == "--help" ]]; then exit 0; fi
                  printf '%s test stub\n' "$(basename "$0")"
                  EOF
                    chmod +x "$RUNNER_TEMP/runwield-ci-bin/$binary"
                  done
                  echo "$RUNNER_TEMP/runwield-ci-bin" >> "$GITHUB_PATH"
            - name: Install frozen dependencies
              run: bun run install:locked
            - name: Check source and test types
              run: bun run check
            - name: Build embedded Workspace for source integration tests
              run: bun run workspace:build
            - name: Run isolated Bun inventory shard
              env:
                  BUN_SHARD: ${{ matrix.shard }}
              run: |
                  bun -e '
                    const files = await Bun.file("scripts/bun-test-files.json").json();
                    const shard = Number(process.env.BUN_SHARD);
                    const selected = files.filter((_, index) => index % 4 === shard - 1);
                    if (!selected.length) throw new Error("Empty Bun qualification shard");
                    console.log(`Qualifying ${selected.length}/${files.length} files in shard ${shard}/4`);
                    const child = Bun.spawn([process.execPath, "scripts/run-bun-tests.ts", ...selected], {
                      stdin: "ignore", stdout: "inherit", stderr: "inherit",
                    });
                    process.exit(await child.exited);
                  '
            - name: Retain qualification reports
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: bun-unix-${{ matrix.runner }}-source-${{ matrix.shard }}-${{ github.run_attempt }}
                  retention-days: 3
                  include-hidden-files: true
                  if-no-files-found: warn
                  path: .ci-cache/bun-report-*/

    package:
        name: Bun ${{ matrix.runner }} package
        if: github.event.repository.private == false
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-latest, macos-latest]
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install frozen dependencies
              run: bun run install:locked
            - name: Verify native lock interoperability
              run: bun scripts/check-lock-interoperability.ts "$(command -v deno)"
            - name: Qualify compiled Bun release surfaces
              # Exercise explicit Candidate identity without publishing this synthetic version.
              run: bun scripts/release-check.js --runtime bun --binary-only --build-version v0.0.0-rc.1
