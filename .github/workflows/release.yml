name: release-gate

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: Existing immutable release tag to recover
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: release-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

jobs:
    metadata:
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.existing.outputs.published }}
            tag: ${{ steps.metadata.outputs.tag }}
            source_sha: ${{ steps.source.outputs.sha }}
            bun_version: ${{ steps.source.outputs.bun_version }}
            legacy_containers: ${{ steps.source.outputs.legacy_containers }}
            kind: ${{ steps.metadata.outputs.kind }}
            build_version: ${{ steps.metadata.outputs.build_version }}
            prerelease: ${{ steps.metadata.outputs.prerelease }}
            make_latest: ${{ steps.metadata.outputs.make_latest }}
            astro_key: ${{ steps.build-key.outputs.value }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.sha }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen dependencies
              run: bun run install:locked

            - name: Validate release metadata
              id: metadata
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  bun run release:metadata --tag "$RELEASE_TAG" > metadata.json
                  bun -e '
                    const metadata = JSON.parse(await Bun.file("metadata.json").text());
                    if (metadata.tag !== process.env.RELEASE_TAG) throw new Error("metadata tag mismatch");
                    const lines = [
                      `tag=${metadata.tag}`,
                      `kind=${metadata.kind}`,
                      `build_version=${metadata.buildVersion}`,
                      `prerelease=${metadata.prerelease}`,
                      `make_latest=${metadata.makeLatest}`,
                    ];
                    await (await import("node:fs/promises")).appendFile(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
                  '

            - name: Resolve the immutable product commit
              id: source
              env:
                  RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
                  RECOVERY: ${{ github.event_name == 'workflow_dispatch' }}
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
                  source_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
                  echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
                  bun_version=$(git show "$source_sha:.bun-version")
                  echo "bun_version=$bun_version" >> "$GITHUB_OUTPUT"
                  # Frozen compatibility set: existing Bun releases with Deno container recipes.
                  # New source never falls back because a tool or test went missing.
                  legacy_containers=false
                  if [[ "$RECOVERY" == true ]]; then
                    case "$source_sha" in
                      55cc60ec1cf5a96eeb41c9fddd12459200101aab|d46be40f400aa3d07c56007c0a8aadabea5b6aeb)
                        legacy_containers=true ;;
                    esac
                  fi
                  echo "legacy_containers=$legacy_containers" >> "$GITHUB_OUTPUT"

            - name: Generate one workspace encryption key for all release targets
              id: build-key
              run: echo "value=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"

            - name: Detect existing release without hiding API failures
              id: existing
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > release-tags.txt
                  if grep -Fxq "$RELEASE_TAG" release-tags.txt; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "published=false" >> "$GITHUB_OUTPUT"
                  fi

    ci-shards:
        runs-on: ubuntu-latest
        needs: metadata

        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        env:
            WLD_TEST_SHARD: ${{ matrix.shard }}/4
            WLD_TEST_CONCURRENCY: "4"

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.sha }}
                  submodules: recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen dependencies
              run: bun run install:locked

            - name: Restore Snip binary
              id: snip-cache
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/runwield-ci-bin/snip
                  key: snip-${{ runner.os }}-${{ runner.arch }}-v0.24.1

            - name: Setup Go for Snip
              if: steps.snip-cache.outputs.cache-hit != 'true'
              uses: actions/setup-go@v6
              with:
                  go-version: "1.25.x"
                  cache: false

            - name: Restore source timing history
              uses: actions/cache/restore@v4
              with:
                  path: .ci-cache/tests-*-timings.json
                  key: source-timings-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      source-timings-${{ runner.os }}-${{ matrix.shard }}-

            - name: Prepare source-quality environment
              run: |
                  git checkout -B main "$GITHUB_SHA"
                  mkdir -p "$RUNNER_TEMP/runwield-ci-bin"
                  for binary in mnemoteca cymbal ketch; do
                    cat > "$RUNNER_TEMP/runwield-ci-bin/$binary" <<'EOF'
                  #!/usr/bin/env bash
                  if [[ "$1" == "--help" ]]; then exit 0; fi
                  printf '%s test stub\n' "$(basename "$0")"
                  EOF
                    chmod +x "$RUNNER_TEMP/runwield-ci-bin/$binary"
                  done
                  if [[ ! -x "$RUNNER_TEMP/runwield-ci-bin/snip" ]]; then
                    GOBIN="$RUNNER_TEMP/runwield-ci-bin" go install github.com/edouard-claude/snip/cmd/snip@v0.24.1
                  fi
                  mkdir -p "$HOME/.config/snip/filters"
                  cp src/snip-filters/*.yaml "$HOME/.config/snip/filters/"
                  echo "$RUNNER_TEMP/runwield-ci-bin" >> "$GITHUB_PATH"

            - name: Run source-quality gate
              timeout-minutes: 15
              run: bun run ci --source-only

            - name: Save source timing history
              if: always() && hashFiles('.ci-cache/tests-*-timings.json') != ''
              uses: actions/cache/save@v4
              with:
                  path: .ci-cache/tests-*-timings.json
                  key: source-timings-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Retain source timings and per-test results
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: source-results-${{ matrix.shard }}-${{ github.run_attempt }}
                  include-hidden-files: true
                  path: .ci-cache/
                  if-no-files-found: ignore

            - name: Print source-quality failure logs
              if: failure()
              run: |
                  for log in /tmp/*-failure-*.log; do
                    if [[ -f "$log" ]]; then
                      echo "::group::$log"
                      cat "$log"
                      echo "::endgroup::"
                    fi
                  done

            - name: Retain source failure evidence
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: source-failure-${{ matrix.shard }}-${{ github.run_attempt }}
                  include-hidden-files: true
                  path: |
                      /tmp/*-failure-*.log
                      /tmp/runwield-test-sandboxes-*-evidence/**

    golden-shards:
        runs-on: ubuntu-latest
        needs: metadata
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        env:
            WLD_TEST_SHARD: ${{ matrix.shard }}/4

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.source_sha }}
                  submodules: recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen dependencies
              run: bun run install:locked

            - name: Restore Snip binary
              id: snip-cache
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/runwield-ci-bin/snip
                  key: snip-${{ runner.os }}-${{ runner.arch }}-v0.24.1

            - name: Setup Go for Snip
              if: steps.snip-cache.outputs.cache-hit != 'true'
              uses: actions/setup-go@v6
              with:
                  go-version: "1.25.x"
                  cache: false

            - name: Restore Golden timing history
              uses: actions/cache/restore@v4
              with:
                  path: .ci-cache/golden-timings.json
                  key: golden-timings-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      golden-timings-${{ runner.os }}-${{ matrix.shard }}-

            - name: Prepare Golden environment
              run: |
                  mkdir -p "$RUNNER_TEMP/runwield-ci-bin"
                  for binary in mnemoteca cymbal ketch; do
                    cat > "$RUNNER_TEMP/runwield-ci-bin/$binary" <<'EOF'
                  #!/usr/bin/env bash
                  if [[ "$1" == "--help" ]]; then exit 0; fi
                  printf '%s test stub\n' "$(basename "$0")"
                  EOF
                    chmod +x "$RUNNER_TEMP/runwield-ci-bin/$binary"
                  done
                  if [[ ! -x "$RUNNER_TEMP/runwield-ci-bin/snip" ]]; then
                    GOBIN="$RUNNER_TEMP/runwield-ci-bin" go install github.com/edouard-claude/snip/cmd/snip@v0.24.1
                  fi
                  mkdir -p "$HOME/.config/snip/filters"
                  cp src/snip-filters/*.yaml "$HOME/.config/snip/filters/"
                  echo "$RUNNER_TEMP/runwield-ci-bin" >> "$GITHUB_PATH"

            - name: Run Golden TUI release gate
              env:
                  WLD_TEST_CONCURRENCY: "3"
              run: bun scripts/write-version.js && bun scripts/run-tests.js --isolated src/ui/tui/testing src/ui/tui/golden-scenarios --fail-fast --timings-file .ci-cache/golden-timings.json

            - name: Save Golden timing history
              if: always() && hashFiles('.ci-cache/golden-timings.json') != ''
              uses: actions/cache/save@v4
              with:
                  path: .ci-cache/golden-timings.json
                  key: golden-timings-${{ runner.os }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

            - name: Retain Golden timings and per-test results
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: golden-results-${{ matrix.shard }}-${{ github.run_attempt }}
                  include-hidden-files: true
                  path: .ci-cache/
                  if-no-files-found: ignore

            - name: Print Golden failure logs
              if: failure()
              run: |
                  for log in /tmp/*-failure-*.log; do
                    if [[ -f "$log" ]]; then
                      echo "::group::$log"
                      cat "$log"
                      echo "::endgroup::"
                    fi
                  done

            - name: Retain Golden failure evidence
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: golden-failure-${{ matrix.shard }}-${{ github.run_attempt }}
                  include-hidden-files: true
                  path: |
                      /tmp/*-failure-*.log
                      /tmp/runwield-test-sandboxes-*-evidence/**

    release-check:
        runs-on: ubuntu-latest
        needs: metadata
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.source_sha }}
                  submodules: recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen Bun dependencies
              run: bun run install:locked

            - name: Run release binary smoke checks
              env:
                  WLD_BUILD_VERSION: ${{ needs.metadata.outputs.build_version }}
                  ASTRO_KEY: ${{ needs.metadata.outputs.astro_key }}
              run: bun scripts/release-check.js --runtime bun --binary-only --build-version "${{ needs.metadata.outputs.build_version }}"

    unix-checks:
        needs: metadata
        uses: ./.github/workflows/release-unix.yml
        with:
            source_sha: ${{ needs.metadata.outputs.source_sha }}
            build_version: ${{ needs.metadata.outputs.build_version }}
        permissions:
            contents: read

    windows-checks:
        needs: metadata
        uses: ./.github/workflows/release-windows.yml
        with:
            source_sha: ${{ needs.metadata.outputs.source_sha }}
            build_version: ${{ needs.metadata.outputs.build_version }}
        permissions:
            contents: read

    containers-checks:
        needs: metadata
        uses: ./.github/workflows/release-containers.yml
        with:
            source_sha: ${{ needs.metadata.outputs.source_sha }}
            build_version: ${{ needs.metadata.outputs.build_version }}
            legacy_recovery: ${{ needs.metadata.outputs.legacy_containers == 'true' }}
        permissions:
            contents: read

    build:
        if: needs.metadata.outputs.published != 'true'
        runs-on: ubuntu-latest
        # Compilation can overlap qualification; assets and publication still
        # require every source, Golden, and binary gate to succeed.
        needs: metadata
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: aarch64-apple-darwin
                      bun_target: bun-darwin-arm64
                      asset_suffix: darwin-arm64
                      binary_name: wld
                    - target: x86_64-apple-darwin
                      bun_target: bun-darwin-x64
                      asset_suffix: darwin-x64
                      binary_name: wld
                    - target: x86_64-unknown-linux-gnu
                      bun_target: bun-linux-x64
                      asset_suffix: linux-x64
                      binary_name: wld
                    - target: aarch64-unknown-linux-gnu
                      bun_target: bun-linux-arm64
                      asset_suffix: linux-arm64
                      binary_name: wld
                    - target: x86_64-pc-windows-msvc
                      bun_target: bun-windows-x64
                      asset_suffix: windows-x64
                      binary_name: wld.exe

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.source_sha }}
                  submodules: recursive

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen Bun dependencies
              run: bun run install:locked

            - name: Compile binary
              env:
                  WLD_BUILD_VERSION: ${{ needs.metadata.outputs.build_version }}
                  ASTRO_KEY: ${{ needs.metadata.outputs.astro_key }}
              run: |
                  if [ -f scripts/compile-command.ts ]; then
                    bun run compile --output "${{ matrix.binary_name }}" --target "${{ matrix.target }}"
                  else
                    # Immutable RC1 checkouts predate the Bun implementation of `compile`.
                    bun run compile:bun "${{ matrix.binary_name }}" "${{ matrix.bun_target }}"
                  fi

            - name: Smoke test native binary
              if: matrix.target == 'x86_64-unknown-linux-gnu'
              run: |
                  ./wld --version | tee version.txt
                  grep -F "runwield ${{ needs.metadata.outputs.build_version }} (" version.txt
                  ./wld --remote-preflight > preflight.json
                  bun -e '
                    const embedded = JSON.parse(await Bun.file("preflight.json").text());
                    const artifact = JSON.parse(await Bun.file("wld.build.json").text());
                    if (embedded.buildId !== artifact.buildId || embedded.protocol !== artifact.protocol ||
                        embedded.version !== artifact.version || embedded.runtime !== "bun" ||
                        embedded.runtimeVersion !== process.versions.bun) {
                      throw new Error("Linux runtime embedded build/protocol/VERSION differs from release metadata");
                    }
                  '

            - name: Package artifact
              run: |
                  VERSION="${{ needs.metadata.outputs.build_version }}"
                  ASSET_BASE="wld-${VERSION}-${{ matrix.asset_suffix }}"
                  if [[ "${{ matrix.binary_name }}" == "wld" ]]; then
                    tar -czf "${ASSET_BASE}.tar.gz" wld wld.build.json
                    tar -cf - wld wld.build.json | zstd -10 -T0 -o "${ASSET_BASE}.tar.zst"
                  else
                    tar -czf "${ASSET_BASE}.tar.gz" wld.exe wld.exe.build.json
                    tar -cf - wld.exe wld.exe.build.json | zstd -10 -T0 -o "${ASSET_BASE}.tar.zst"
                  fi
                  sha256sum "${ASSET_BASE}.tar.gz" > "${ASSET_BASE}.tar.gz.sha256"
                  sha256sum "${ASSET_BASE}.tar.zst" > "${ASSET_BASE}.tar.zst.sha256"
                  if [[ "${{ matrix.asset_suffix }}" == "windows-x64" ]]; then
                    bun scripts/package-windows.js --tag "$VERSION" --binary "${{ matrix.binary_name }}" --output .
                  fi

            - name: Upload build artifact
              uses: actions/upload-artifact@v5
              with:
                  name: wld-${{ matrix.asset_suffix }}
                  path: |
                      *.tar.gz
                      *.tar.zst
                      *.zip
                      runwield-windows-package.json
                      *.sha256

    assets:
        runs-on: ubuntu-latest
        if: ${{ !cancelled() && (needs.build.result == 'success' || needs.metadata.outputs.published == 'true') }}
        needs: [metadata, build]
        steps:
            - name: Checkout release tooling
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.metadata.outputs.source_sha }}

            - name: Checkout tagged schema
              if: needs.metadata.outputs.published != 'true'
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.source_sha }}
                  path: release-source

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen dependencies
              run: bun run install:locked

            - name: Download matrix artifacts
              if: needs.metadata.outputs.published != 'true'
              uses: actions/download-artifact@v5
              with:
                  path: release-artifacts
                  pattern: wld-*
                  merge-multiple: false

            - name: Prepare unique checked upload set
              if: needs.metadata.outputs.published != 'true'
              env:
                  RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
              run: |
                  cp release-source/config.schema.json release-artifacts/config.schema.json
                  bun scripts/release-assets.js release-artifacts release-upload "$RELEASE_TAG"

            - name: Reuse and verify published assets
              if: needs.metadata.outputs.published == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
              run: |
                  gh release download "$RELEASE_TAG" --dir release-artifacts
                  gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > published-release.json
                  bun scripts/release-assets.js release-artifacts release-upload "$RELEASE_TAG" published published-release.json

            - name: Retain checked release bytes
              uses: actions/upload-artifact@v5
              with:
                  name: release-upload
                  path: release-upload/*

    native-package-check:
        if: ${{ !cancelled() && needs.assets.result == 'success' }}
        needs: [metadata, assets]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      asset: linux-x64
                      target: x86_64-unknown-linux-gnu
                    - runner: ubuntu-24.04-arm
                      asset: linux-arm64
                      target: aarch64-unknown-linux-gnu
                    - runner: macos-15
                      asset: darwin-arm64
                      target: aarch64-apple-darwin
                    - runner: macos-15-intel
                      asset: darwin-x64
                      target: x86_64-apple-darwin
        steps:
            - name: Checkout package verification tooling
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.metadata.outputs.source_sha }}
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version
            - name: Download checked release bytes
              uses: actions/download-artifact@v5
              with:
                  name: release-upload
                  path: release-upload
            - name: Validate the actual native release archive
              env:
                  BUILD_VERSION: ${{ needs.metadata.outputs.build_version }}
                  ASSET: ${{ matrix.asset }}
                  TARGET: ${{ matrix.target }}
                  PRODUCT_BUN_VERSION: ${{ needs.metadata.outputs.bun_version }}
              run: |
                  mkdir native-package
                  tar -xzf "release-upload/wld-$BUILD_VERSION-$ASSET.tar.gz" -C native-package
                  ./native-package/wld --help > /dev/null
                  ./native-package/wld --version | tee version.txt
                  grep -F "runwield $BUILD_VERSION (" version.txt
                  ./native-package/wld --remote-preflight > preflight.json
                  bun -e '
                    const embedded = await Bun.file("preflight.json").json();
                    const artifact = await Bun.file("native-package/wld.build.json").json();
                    if (embedded.buildId !== artifact.buildId || embedded.protocol !== artifact.protocol ||
                        embedded.version !== artifact.version || artifact.version !== process.env.BUILD_VERSION ||
                        artifact.target !== process.env.TARGET || embedded.runtime !== "bun" ||
                        embedded.runtimeVersion !== process.env.PRODUCT_BUN_VERSION) {
                      throw new Error("Release archive identity differs from selected release");
                    }
                  '

    windows-package-check:
        if: ${{ !cancelled() && needs.assets.result == 'success' }}
        runs-on: windows-latest
        needs: [metadata, assets]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.metadata.outputs.source_sha }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen dependencies
              run: bun run install:locked

            - name: Download Windows package artifact
              uses: actions/download-artifact@v5
              with:
                  name: release-upload
                  path: windows-package

            - name: Run native Windows package checks
              shell: pwsh
              run: |
                  $zip = Get-ChildItem windows-package -Filter "wld-*-windows-x64.zip" | Select-Object -First 1
                  if (-not $zip) { throw "Windows package ZIP not found" }
                  bun run package:windows:check --package $zip.FullName

    homebrew-check:
        if: ${{ !cancelled() && needs.assets.result == 'success' }}
        runs-on: macos-15
        timeout-minutes: 30
        needs: [metadata, assets]
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.metadata.outputs.source_sha }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen dependencies
              run: bun run install:locked

            - name: Verify Stable package credentials
              if: needs.metadata.outputs.kind == 'stable'
              env:
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              run: |
                  test -n "$HOMEBREW_TAP_TOKEN"
                  GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api repos/gandazgul/homebrew-tap --jq '.permissions.push' | grep -Fx true

            - name: Download checked release bytes
              uses: actions/download-artifact@v5
              with:
                  name: release-upload
                  path: release-upload

            - name: Register Homebrew dependency tap
              run: |
                  # Runner images can disable auto-update and carry stale Core API data.
                  brew update
                  brew tap 1broseidon/tap
                  brew trust --formula 1broseidon/tap/cymbal
                  # Runner images can leave an unowned legacy link that blocks openssl@3.
                  brew_prefix="$(brew --prefix)"
                  if [[ "$(readlink "$brew_prefix/bin/openssl")" == "$brew_prefix/opt/openssl@1.1/bin/openssl" ]]; then
                    unlink "$brew_prefix/bin/openssl"
                  fi

            - name: Validate Homebrew before publication
              env:
                  RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
              run: |
                  python3 -m http.server 8765 --bind 127.0.0.1 --directory release-upload > "$RUNNER_TEMP/release-http.log" 2>&1 &
                  server_pid=$!
                  trap 'kill "$server_pid"' EXIT
                  for attempt in {1..30}; do
                    if curl --fail --silent http://127.0.0.1:8765/SHA256SUMS > /dev/null; then break; fi
                    sleep 1
                  done
                  bun run package:homebrew --wld-tag "$RELEASE_TAG" --mnemoteca-tag v0.3.3 \
                    --output homebrew-check --test-only --wld-base-url http://127.0.0.1:8765
                  bun run package:homebrew:check --tap homebrew-check

    release:
        if: ${{ !cancelled() && needs.ci.result == 'success' && needs.golden.result == 'success' && needs.release-check.result == 'success' && needs.assets.result == 'success' && needs.windows-package-check.result == 'success' && needs.native-package-check.result == 'success' && needs.homebrew-check.result == 'success' && needs.unix-checks.result == 'success' && needs.windows-checks.result == 'success' && needs.containers-checks.result == 'success' }}
        runs-on: ubuntu-latest
        needs:
            - metadata
            - ci
            - golden
            - release-check
            - assets
            - windows-package-check
            - native-package-check
            - homebrew-check
            - unix-checks
            - windows-checks
            - containers-checks
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ needs.metadata.outputs.source_sha }}

            - name: Download checked release bytes
              if: needs.metadata.outputs.published != 'true'
              uses: actions/download-artifact@v5
              with:
                  name: release-upload
                  path: release-upload

            - name: Publish release assets
              if: needs.metadata.outputs.published != 'true'
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.metadata.outputs.tag }}
                  prerelease: ${{ needs.metadata.outputs.prerelease }}
                  make_latest: ${{ needs.metadata.outputs.make_latest }}
                  preserve_order: true
                  overwrite_files: false
                  fail_on_unmatched_files: true
                  files: release-upload/*

    winget-package:
        runs-on: ubuntu-latest
        if: ${{ !cancelled() && needs.release.result == 'success' && needs.metadata.outputs.kind == 'stable' }}
        needs:
            - metadata
            - release

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.metadata.outputs.source_sha }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen dependencies
              run: bun run install:locked

            - name: Render WinGet manifest artifact
              run: |
                  bun run package:winget --tag "${{ needs.metadata.outputs.tag }}" --output winget-manifests
                  tar -czf "runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz" -C winget-manifests .
                  shasum -a 256 "runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz" > "runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz.sha256"

            - name: Upload WinGet manifest artifact
              uses: actions/upload-artifact@v5
              with:
                  name: runwield-winget-manifests-${{ needs.metadata.outputs.tag }}
                  path: |
                      runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz
                      runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz.sha256

    winget-submit:
        runs-on: windows-latest
        # Owner paused submissions until further notice; keep manifest preparation active.
        if: ${{ false }}
        needs:
            - metadata
            - winget-package

        steps:
            - name: Download WinGet manifest artifact
              uses: actions/download-artifact@v5
              with:
                  name: runwield-winget-manifests-${{ needs.metadata.outputs.tag }}
                  path: winget-package

            - name: Submit WinGet pull request
              shell: pwsh
              env:
                  WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
              run: |
                  if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
                      throw "WINGET_CREATE_GITHUB_TOKEN is not configured"
                  }

                  $version = "${{ needs.metadata.outputs.build_version }}".TrimStart("v")
                  $prTitle = "New version: Gandazgul.RunWield version $version"
                  $headers = @{
                      Authorization = "Bearer $env:WINGET_CREATE_GITHUB_TOKEN"
                      Accept = "application/vnd.github+json"
                      "X-GitHub-Api-Version" = "2022-11-28"
                  }

                  $catalogUri = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/g/Gandazgul/RunWield/$version"
                  try {
                      Invoke-RestMethod $catalogUri -Headers $headers -ErrorAction Stop | Out-Null
                      Write-Host "Gandazgul.RunWield $version is already in the WinGet catalog; submission is complete."
                      exit 0
                  } catch {
                      if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
                  }

                  $query = [uri]::EscapeDataString("repo:microsoft/winget-pkgs is:pr is:open in:title `"$prTitle`"")
                  $search = Invoke-RestMethod "https://api.github.com/search/issues?q=$query" -Headers $headers
                  $existingPr = $search.items | Where-Object { $_.title -eq $prTitle } | Select-Object -First 1
                  if ($existingPr) {
                      Write-Host "WinGet submission already exists: $($existingPr.html_url)"
                      exit 0
                  }

                  $archive = Join-Path $PWD "winget-package/runwield-winget-manifests-${{ needs.metadata.outputs.tag }}.tar.gz"
                  $checksumFile = "$archive.sha256"
                  $expectedChecksum = ((Get-Content $checksumFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
                  $actualChecksum = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actualChecksum -ne $expectedChecksum) {
                      throw "WinGet manifest artifact checksum mismatch"
                  }

                  $manifestRoot = Join-Path $PWD "winget-manifests"
                  New-Item -ItemType Directory -Path $manifestRoot | Out-Null
                  tar -xzf $archive -C $manifestRoot

                  $wingetCreateVersion = "1.12.13.0"
                  $wingetCreateChecksum = "24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea"
                  $wingetCreate = Join-Path $PWD "wingetcreate.exe"
                  $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/v$wingetCreateVersion/wingetcreate.exe"
                  Invoke-WebRequest $wingetCreateUrl -OutFile $wingetCreate
                  $actualToolChecksum = (Get-FileHash $wingetCreate -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actualToolChecksum -ne $wingetCreateChecksum) {
                      throw "WingetCreate checksum mismatch"
                  }

                  $manifestPath = Join-Path $manifestRoot "Gandazgul.RunWield/$version"
                  & $wingetCreate submit $manifestPath --prtitle $prTitle --no-open
                  if ($LASTEXITCODE -ne 0) {
                      throw "WingetCreate submission failed with exit code $LASTEXITCODE"
                  }

    homebrew-package:
        runs-on: macos-15
        timeout-minutes: 30
        if: ${{ !cancelled() && needs.release.result == 'success' && needs.metadata.outputs.kind == 'stable' }}
        needs:
            - metadata
            - release
        concurrency:
            group: homebrew-tap-publication
            cancel-in-progress: false

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.metadata.outputs.source_sha }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: .bun-version

            - name: Install frozen dependencies
              run: bun run install:locked

            - name: Verify Homebrew tap credential
              env:
                  HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              run: |
                  if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
                    echo "HOMEBREW_TAP_TOKEN is required to publish Stable releases" >&2
                    exit 1
                  fi

            - name: Render Homebrew tap
              run: |
                  bun run package:homebrew \
                    --wld-tag "${{ needs.metadata.outputs.tag }}" \
                    --mnemoteca-tag "v0.3.3" \
                    --output homebrew-tap

            - name: Register Homebrew dependency tap
              run: |
                  # Runner images can disable auto-update and carry stale Core API data.
                  brew update
                  brew tap 1broseidon/tap
                  brew trust --formula 1broseidon/tap/cymbal

            - name: Validate Homebrew tap
              run: |
                  # Hosted runners can retain an orphaned openssl@1.1 link that brew unlink does not remove.
                  brew_prefix="$(brew --prefix)"
                  openssl_link="$brew_prefix/bin/openssl"
                  if [[ -L "$openssl_link" && "$(readlink "$openssl_link")" == "$brew_prefix/opt/openssl@1.1/bin/openssl" ]]; then
                    unlink "$openssl_link"
                  fi
                  bun run package:homebrew:check --tap homebrew-tap

            - name: Archive verified Homebrew tap
              run: |
                  tar -czf "runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz" \
                    -C homebrew-tap Formula README.md runwield-homebrew-package.json
                  shasum -a 256 "runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz" > "runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz.sha256"

            - name: Upload verified Homebrew tap artifact
              uses: actions/upload-artifact@v5
              with:
                  name: runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}
                  path: |
                      runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz
                      runwield-homebrew-tap-${{ needs.metadata.outputs.tag }}.tar.gz.sha256

            - name: Checkout Homebrew tap repository
              uses: actions/checkout@v5
              with:
                  repository: gandazgul/homebrew-tap
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  path: homebrew-tap-publish
                  fetch-depth: 0

            - name: Publish verified Homebrew tap
              run: |
                  cp homebrew-tap/Formula/wld.rb homebrew-tap-publish/Formula/wld.rb
                  cp homebrew-tap/Formula/mnemoteca.rb homebrew-tap-publish/Formula/mnemoteca.rb
                  cp homebrew-tap/README.md homebrew-tap-publish/README.md
                  cp homebrew-tap/runwield-homebrew-package.json homebrew-tap-publish/runwield-homebrew-package.json
                  cd homebrew-tap-publish
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add Formula README.md runwield-homebrew-package.json
                  if git diff --cached --quiet; then
                    echo "Homebrew tap already matches ${{ needs.metadata.outputs.tag }}"
                    exit 0
                  fi
                  git commit -m "Update RunWield to ${{ needs.metadata.outputs.tag }}"
                  git push origin HEAD:main

    publish-docs:
        if: ${{ !cancelled() && needs.metadata.outputs.kind == 'stable' && needs.release.result == 'success' }}
        needs:
            - metadata
            - release
        uses: ./.github/workflows/docs.yml
        with:
            tag: ${{ needs.metadata.outputs.tag }}
        permissions:
            contents: write
            pages: write
            id-token: write

    ci:
        if: always()
        needs: ci-shards
        runs-on: ubuntu-latest
        steps:
            - name: Require every source shard
              run: test '${{ needs.ci-shards.result }}' = 'success'

    golden:
        if: always()
        needs: golden-shards
        runs-on: ubuntu-latest
        steps:
            - name: Require every Golden shard
              run: test '${{ needs.golden-shards.result }}' = 'success'
