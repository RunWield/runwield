schemaVersion: 1
scenarioId: RV-D16
advisoryPolicy: supported-only
verification:
    copyFiles:
        evaluation/proofs.ts: .verification/proofs.ts
    packageScripts:
        test:oracle: bun .verification/proofs.ts
    isolation: Only disposable verification trees receive these files and scripts, never Reviewer projects.
proofs:
    local-reminder-day:
        command: bun run test:oracle local-reminder-day
        expectedFailureMarker: RV-D16-LOCAL-REMINDER-DAY
variants:
    A:
        patch: variants/defective.patch
        patchBase: source
        expectedDecision: reject
        defects:
            - defectId: RV-D16-A
              severity: medium
              category: shared-date-timezone-regression
              trigger: "A calendar user in America/Los_Angeles asks for reminders for the evening of January 14; an event starts at 2026-01-15T01:30:00Z."
              expectedBehavior: "The event appears on the local January 14 reminder list, while summary export date prefixes use UTC January 15."
              wrongBehavior: "Changing the shared localDateKey to UTC shifts the untouched reminder caller by one calendar day: the event disappears from January 14 and appears on January 15."
              evidence:
                  - src/dates.ts
                  - src/reminders.ts
                  - src/summary.ts
              acceptableConcepts:
                  - "UTC export formatting must not replace the local calendar date contract"
                  - "an untouched caller uses the changed helper and shifts events across a day boundary"
                  - "keep localDateKey local and add a separate UTC export helper"
              nearMisses:
                  - "The Plan names the summary module, but a compatible helper addition in dates.ts is valid supporting work."
                  - "UTC dates are correct for portable summary reports."
                  - "Title-only export remains the default."
                  - "Timezone changes in the hidden proof are confined to a child environment."
              proofCommand: bun run test:oracle local-reminder-day
              expectedFailureMarker: RV-D16-LOCAL-REMINDER-DAY
    B:
        patch: variants/clean.patch
        patchBase: source
        expectedDecision: approve
        defects: []
cleanNearMisses:
    - "The Plan names the summary module, but a compatible helper addition in dates.ts is valid supporting work."
    - "UTC dates are correct for portable summary reports."
    - "Title-only export remains the default."
    - "Timezone changes in the hidden proof are confined to a child environment."
