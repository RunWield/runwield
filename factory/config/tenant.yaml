apiVersion: v1
kind: Namespace
metadata:
    name: runwield-personal
    labels:
        pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: factory-controller
    namespace: runwield-personal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: factory-controller
    namespace: runwield-personal
rules:
    - apiGroups: [factory.runwield.dev]
      resources: [factoryruns, stepexecutions, githubtriages]
      verbs: [get, list, watch, create]
    - apiGroups: [factory.runwield.dev]
      resources: [factoryruns/status, stepexecutions/status, githubtriages/status]
      verbs: [get, patch]
    - apiGroups: [batch]
      resources: [jobs]
      verbs: [get, list, watch, create, delete]
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get]
    - apiGroups: [""]
      resources: [persistentvolumeclaims, serviceaccounts]
      verbs: [get, create]
    - apiGroups: [rbac.authorization.k8s.io]
      resources: [roles, rolebindings]
      verbs: [get, create]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: factory-controller
    namespace: runwield-personal
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: factory-controller
subjects:
    - kind: ServiceAccount
      name: factory-controller
      namespace: runwield-personal
---
# An administrator explicitly binds this role to a client identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: factory-client
    namespace: runwield-personal
rules:
    - apiGroups: [factory.runwield.dev]
      resources: [factoryruns, githubtriages]
      verbs: [create, get, list, watch]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: factory-isolation
    namespace: runwield-personal
spec:
    podSelector: {}
    policyTypes: [Ingress, Egress]
    ingress: []
    egress:
        - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
                podSelector:
                    matchLabels:
                        k8s-app: kube-dns
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: factory-controller
    namespace: runwield-personal
spec:
    replicas: 1
    selector:
        matchLabels:
            app: factory-controller
    template:
        metadata:
            labels:
                app: factory-controller
        spec:
            serviceAccountName: factory-controller
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: controller
                  image: localhost/runwield-factory:dev
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: FACTORY_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                      - name: FACTORY_WORKER_IMAGE
                        value: localhost/runwield-factory:dev
                      - name: FACTORY_CREDENTIAL_SECRET
                        value: factory-model-auth
                      - name: FACTORY_GITHUB_SECRET
                        value: factory-github-auth
                  volumeMounts:
                      - name: github
                        mountPath: /github
                        readOnly: true
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: [ALL]
                  resources:
                      requests:
                          cpu: 50m
                          memory: 64Mi
                      limits:
                          cpu: "1"
                          memory: 256Mi
            volumes:
                - name: github
                  secret:
                      secretName: factory-github-auth
                      optional: true
                      defaultMode: 288
