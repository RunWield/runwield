# Local test deployment; Bun runtime permission equivalence is deferred.
# This definition is not a hardened production security boundary.
services:
    runwield-plan-server:
        build:
            context: .
            dockerfile: Containerfile
        image: runwield-plan-server:local
        restart: unless-stopped
        read_only: true
        cap_drop: [ALL]
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m
        environment:
            RUNWIELD_REMOTE_HOST: 0.0.0.0
            RUNWIELD_REMOTE_PORT: "8080"
            RUNWIELD_REMOTE_DB_PATH: /data/runwield-shared-spaces.sqlite
            RUNWIELD_REMOTE_MAX_REQUEST_BYTES: "5242880"
            # Optional retention for disposable collaboration tests.
        ports:
            - "127.0.0.1:8080:8080"
        volumes:
            - runwield-plan-server-data:/data
        healthcheck:
            test:
                - CMD
                - bun
                - --no-env-file
                - --no-install
                - -e
                - 'const r = await fetch("http://127.0.0.1:8080/readyz"); if (!r.ok) process.exit(1);'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    runwield-plan-server-data:
